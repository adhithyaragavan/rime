# Day-0 gate: pulls one REAL, hardware-signed TDX quote from Phala Cloud and
# writes it to /app/real-quote.hex inside the CVM, for retrieval via
# `phala cp`. Not the production agent deployment (see docker-compose.yml
# for that) — this just needs to run generate-fixture.ts once against the
# real dstack socket. auditHash below is the real value for this repo's
# actual dependency tree (rime.manifest.json), agent address is a throwaway
# keypair used only to exercise the commitment encoding — it holds no funds
# and is never used for a real certify() call.
services:
  probe:
    image: ghcr.io/adhithyaragavan/rime-agent:probe
    command: >
      sh -c "node --experimental-strip-types scripts/generate-fixture.ts
      --out /app/real-quote.hex
      --audit-hash 0x47bd6e6d6d5d7418b7681baae13b7ad35169322786e580527e309a9b795a2b96
      --agent 0x0f156802b1Fb2934b312F077DeF3773861E73275
      --epoch 1;
      echo '--- sleeping so the file can be retrieved via phala cp/ssh ---';
      sleep 3600"
    restart: unless-stopped
